version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local
      MYSQL_DATABASE: trust_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    env_file: .env.local
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data:
