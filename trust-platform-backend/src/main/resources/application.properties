# =========================================
# APPLICATION
# =========================================
spring.application.name=trust-platform-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# =========================================
# DATABASE CONFIGURATION (MySQL)
# =========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trustplatform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false
 
# =========================================
# FLYWAY MIGRATIONS
# =========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.sql.init.mode=never
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql=warn
logging.level.com.trustplatform=info

# =========================================
# JWT CONFIGURATION
# =========================================
app.jwt.secret=${JWT_SECRET:kvg_trust_super_secure_jwt_secret_2026_kvg_trust_super_secure_jwt_secret_2026}
app.jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.verification.expiration=${VERIFICATION_EXPIRATION:86400000}

# =========================================
# RATE LIMITING
# =========================================
rate-limit.auth.capacity=10
rate-limit.auth.refill-tokens=10
rate-limit.auth.refill-seconds=60

# =========================================
# COOKIE
# =========================================
app.cookie.secure=false

# =========================================
# SECURITY
# =========================================
spring.security.user.name=disabled
spring.security.user.password=disabled

# =========================================
# FILE UPLOAD
# =========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =========================================
# ACTUATOR
# =========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.mail.enabled=false

# =========================================
# EMAIL CONFIGURATION
# =========================================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from.name=${APP_MAIL_FROM_NAME}
app.mail.from.email=${APP_MAIL_FROM_EMAIL}

# =========================================
# RAZORPAY
# =========================================
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# =========================================
# PDF RECEIPT ARCHIVAL
# =========================================
app.receipts.storage-path=${APP_RECEIPTS_STORAGE_PATH:./receipts}

# =========================================
# CLOUDINARY
# =========================================
cloudinary.url=${CLOUDINARY_URL:}

# =========================================
# OAUTH2 CLIENT
# =========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# =========================================
# RAZORPAY WEBHOOK SECURITY
# =========================================
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:dummy_secret}

# =========================================
# PAN ENCRYPTION KEY
# =========================================
app.crypto.pan-key=${APP_CRYPTO_PAN_KEY:dummy_pan_key_must_be_32_bytes_long!}