# =========================================
# PRODUCTION PROFILE OVERRIDES
# Activated via: -Dspring.profiles.active=prod
# Inherits all settings from application.properties
# =========================================

# =========================================
# EXTERNALIZED PRODUCTION CONFIGURATION (Strictly required, no fallback values)
# =========================================
spring.datasource.url=${DB_URL}?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET:kvg_trust_super_secure_jwt_secret_2026_kvg_trust_super_secure_jwt_secret_2026}
app.jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.verification.expiration=${VERIFICATION_EXPIRATION:86400000}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

razorpay.key-id=${RAZORPAY_KEY_ID:dummy}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:dummy}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:dummy_secret}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
app.mail.from.name=${APP_MAIL_FROM_NAME}
app.mail.from.email=${APP_MAIL_FROM_EMAIL}

cloudinary.url=${CLOUDINARY_URL:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-secret}

# =========================================
# JPA / HIBERNATE (Production Hardening)
# =========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================
# FLYWAY MIGRATIONS
# =========================================
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

# =========================================
# SECURITY & COOKIES (Production)
# =========================================
app.cookie.secure=true

# =========================================
# ERROR HANDLING
# =========================================
server.error.include-stacktrace=never
server.error.include-message=never

# =========================================
# OBSERVABILITY
# =========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =========================================
# FORWARD HEADERS
# =========================================
server.forward-headers-strategy=native

# =========================================
# HIKARI CONNECTION POOL
# =========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# =========================================
# TIMEZONE & ENCODING
# =========================================
spring.jackson.time-zone=Asia/Kolkata

# =========================================
# GRACEFUL SHUTDOWN
# =========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# =========================================
# LOGGING (Production)
# =========================================
logging.level.root=INFO
logging.level.com.trustplatform=INFO
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql=warn
logging.level.org.springframework.security=warn

# =========================================
# PAN ENCRYPTION KEY (Production - Required)
# =========================================
app.crypto.pan-key=${APP_CRYPTO_PAN_KEY}
